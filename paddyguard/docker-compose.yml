version: "3.9"

services:

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    env_file: ./gateway/.env
    depends_on:
      - voice_nlp
      - leaf_disease_detection
      - pest_detection
      - treatment_advisory_chatbot
      - user_management

  voice_nlp:
    build: ./voice_nlp
    ports:
      - "8001:8001"
    env_file: ./voice_nlp/.env
    volumes:
      - ./voice_nlp/models:/app/models

  leaf_disease_detection:
    build: ./leaf_disease_detection
    ports:
      - "8002:8002"
    env_file: ./leaf_disease_detection/.env
    volumes:
      - ./leaf_disease_detection/models:/app/models

  pest_detection:
    build: ./pest_detection
    ports:
      - "8003:8003"
    env_file: ./pest_detection/.env
    volumes:
      - ./pest_detection/models:/app/models

  treatment_advisory_chatbot:
    build: ./treatment_advisory_chatbot
    ports:
      - "8004:8004"
    env_file: ./treatment_advisory_chatbot/.env

  user_management:
    build: ./user_management
    ports:
      - "8005:8005"
    env_file: ./user_management/.env
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paddyguard
      POSTGRES_PASSWORD: paddyguard123
      POSTGRES_DB: paddyguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
